name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --ignore-scripts

    - name: Run Lint/Tests
      run: npm run build # Or npm test if you have tests

    - name: Deploy to Supabase Migrations (Optional)
      run: echo "Skipping database push. Configure secrets to enable."
      # env:
      #   SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #   SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      #   SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # run: npx supabase db push

    - name: Build Web App
      run: npm run build

    - name: Deploy to Vercel/Netlify
      # Example for Vercel
      # uses: amondnet/vercel-action@v20
      # with:
      #   vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #   vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #   vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #   working-directory: ./
      run: echo "Deploying to hosting..."
