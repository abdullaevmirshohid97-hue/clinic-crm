worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ──────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ─── Performance ──────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # ─── Gzip Compression ─────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_buffers      16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ─── Security Headers ─────────────────────────────────────────────────
  add_header X-Frame-Options         SAMEORIGIN           always;
  add_header X-Content-Type-Options  nosniff              always;
  add_header X-XSS-Protection        "1; mode=block"      always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ─── Rate Limiting ────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ─── Upstream ─────────────────────────────────────────────────────────
  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  # ─── HTTP → HTTPS Redirect (all domains) ────────────────────────────
  server {
    listen 80;
    server_name crm.clary.uz super-admin.clary.uz app.clary.uz;

    # Let's Encrypt challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS: crm.clary.uz ─────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name crm.clary.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.clary.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.clary.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # Health check (bypass rate limit)
    location /health {
      proxy_pass http://api_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade            $http_upgrade;
      proxy_set_header   Connection         "upgrade";
      proxy_set_header   Host               $host;
      proxy_set_header   X-Real-IP          $remote_addr;
      proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto  $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Serve Frontend SPA
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
    }
  }

  # ─── HTTPS: super-admin.clary.uz ─────────────────────────────────────
  server {
    listen 443 ssl;
    server_name super-admin.clary.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.clary.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.clary.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # API routes
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host               $host;
      proxy_set_header   X-Real-IP          $remote_addr;
      proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto  $scheme;
      proxy_read_timeout 60s;
    }

    # Serve Super-Admin SPA
    location / {
      root  /usr/share/nginx/html/super-admin;
      index index.html;
      try_files $uri $uri/ /index.html;

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
    }
  }
}
